<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b98a9"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff5c5c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#48d178"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="54" fill="#e6edf3" font-size="30" font-weight="700" text-anchor="middle">MITM on a Sensibo IoT Controller — where the credentials leak</text>
  <text x="600" y="86" fill="#8b98a9" font-size="17" text-anchor="middle">No TLS certificate validation (CWE-295) + certificate pinning enforced too late</text>

  <!-- Device box -->
  <rect x="70" y="200" width="230" height="150" rx="14" fill="#161d27" stroke="#2b3542" stroke-width="2"/>
  <text x="185" y="248" fill="#e6edf3" font-size="21" font-weight="700" text-anchor="middle">IoT Device</text>
  <text x="185" y="276" fill="#8b98a9" font-size="15" text-anchor="middle">Sensibo AC controller</text>
  <text x="185" y="312" fill="#8b98a9" font-size="14" text-anchor="middle">MQTT over TLS client</text>

  <!-- Attacker box -->
  <rect x="485" y="190" width="230" height="170" rx="14" fill="#241820" stroke="#5c2b36" stroke-width="2"/>
  <text x="600" y="232" fill="#ff8a8a" font-size="21" font-weight="700" text-anchor="middle">Attacker (MITM)</text>
  <text x="600" y="260" fill="#c9a0a8" font-size="15" text-anchor="middle">rogue server</text>
  <text x="600" y="284" fill="#c9a0a8" font-size="14" text-anchor="middle">forged cert (any CN/O)</text>
  <text x="600" y="308" fill="#c9a0a8" font-size="14" text-anchor="middle">ARP + DNS spoofing</text>
  <text x="600" y="332" fill="#c9a0a8" font-size="14" text-anchor="middle">stunnel + mosquitto</text>

  <!-- Real server box -->
  <rect x="900" y="200" width="230" height="150" rx="14" fill="#161d27" stroke="#2b3542" stroke-width="2"/>
  <text x="1015" y="248" fill="#e6edf3" font-size="21" font-weight="700" text-anchor="middle">Sensibo Cloud</text>
  <text x="1015" y="276" fill="#8b98a9" font-size="15" text-anchor="middle">new-emq / new-config</text>
  <text x="1015" y="312" fill="#8b98a9" font-size="14" text-anchor="middle">real certificate</text>

  <!-- Flow arrows device <-> attacker -->
  <line x1="300" y1="238" x2="483" y2="238" stroke="#8b98a9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="392" y="228" fill="#c6d0da" font-size="14" text-anchor="middle">① ClientHello</text>

  <line x1="483" y1="272" x2="302" y2="272" stroke="#8b98a9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="392" y="290" fill="#c6d0da" font-size="14" text-anchor="middle">② forged cert → accepted</text>

  <!-- Handshake complete badge -->
  <rect x="320" y="378" width="250" height="34" rx="17" fill="#15291c" stroke="#2f6b43" stroke-width="1.5"/>
  <text x="445" y="400" fill="#7ee2a0" font-size="15" font-weight="700" text-anchor="middle">✓ TLS handshake completes</text>

  <!-- LEAK arrow -->
  <line x1="300" y1="455" x2="483" y2="455" stroke="#ff5c5c" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <rect x="300" y="470" width="300" height="62" rx="12" fill="#2a1216" stroke="#ff5c5c" stroke-width="2"/>
  <text x="450" y="495" fill="#ff8a8a" font-size="16" font-weight="700" text-anchor="middle">③ MQTT CONNECT</text>
  <text x="450" y="518" fill="#ffb3b3" font-size="14" text-anchor="middle">username + token LEAK 🔓</text>

  <!-- Pinning closes -->
  <rect x="640" y="470" width="300" height="62" rx="12" fill="#1c232e" stroke="#5a6672" stroke-width="2"/>
  <text x="790" y="495" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">④ App-layer pinning check</text>
  <text x="790" y="518" fill="#9fb0c0" font-size="14" text-anchor="middle">✗ connection closed — but too late</text>
  <line x1="600" y1="501" x2="638" y2="501" stroke="#8b98a9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- attacker to real (blocked) -->
  <line x1="715" y1="265" x2="898" y2="265" stroke="#5a6672" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="806" y="255" fill="#7a8696" font-size="13" text-anchor="middle">no stable relay</text>
  <text x="806" y="300" fill="#7a8696" font-size="13" text-anchor="middle">(needs real key)</text>

  <!-- Key takeaway -->
  <rect x="170" y="580" width="860" height="66" rx="14" fill="#10161f" stroke="#2b3542" stroke-width="1.5"/>
  <text x="600" y="610" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">The secret is sent before the server is authenticated.</text>
  <text x="600" y="634" fill="#48d178" font-size="15" text-anchor="middle">Control stays blocked (broker ACL + pinning) — only the credential window leaks.</text>
</svg>
